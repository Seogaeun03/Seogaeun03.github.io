<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>서가은 | 게임 UI, 테크니컬 아트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
:root { --paper: #FDEEDA; --line: #1B1616; --dim: #8a7d6b; --task: 44px; }
html, body { height: 100%; overflow: hidden; }
body { background: #23305a; -webkit-user-select: none; user-select: none; }
/* ── 바탕 ── */
.wall { position: fixed; inset: 0 0 var(--task); background: linear-gradient(180deg, #1f2a52 0%, #2c3f73 60%, #43619e 100%); }
.wall::before { content: ""; position: absolute; inset: 0; opacity: .16; background-image: radial-gradient(#fff 1px, transparent 1.2px); background-size: 6px 6px;
  -webkit-mask-image: linear-gradient(transparent 35%, #000); mask-image: linear-gradient(transparent 35%, #000); }
.brand { position: absolute; left: 136px; bottom: 28px; color: rgba(253,238,218,.92); pointer-events: none; }
.brand b { display: block; font-size: clamp(48px, 7vw, 84px); line-height: 1; font-weight: 400; text-shadow: 4px 4px 0 #18224a; }
.brand span { font-size: 13px; color: #b9c6ff; }
/* ── 아이콘 ── */
.icons { position: fixed; left: 16px; top: 16px; bottom: calc(var(--task) + 16px); display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 92px); gap: 4px 8px; align-content: start; }
.ic { width: 88px; display: grid; justify-items: center; align-content: start; gap: 4px; text-decoration: none; color: var(--paper); font-size: 12px; line-height: 16px; text-align: center; padding: 6px 2px; background: none; border: 0; cursor: pointer; }
.ic .pic { width: 52px; height: 52px; display: grid; place-items: center; }
.ic .pic img { max-width: 52px; max-height: 52px; image-rendering: pixelated; }
.ic .lb { padding: 1px 4px; text-shadow: 1px 1px 0 #18224a; word-break: keep-all; }
.ic[aria-selected="true"] .lb, .ic:focus-visible .lb { background: #02648C; text-shadow: none; }
.ic[aria-selected="true"] .pic { outline: 1px dotted var(--paper); outline-offset: 2px; }
.ic:focus-visible { outline: none; }
.file { width: 40px; height: 50px; background: var(--paper); position: relative; clip-path: polygon(0 0, 70% 0, 100% 22%, 100% 100%, 0 100%); }
.file::after { content: attr(data-t); position: absolute; left: 0; right: 0; bottom: 6px; font-size: 10px; line-height: 14px; color: #fff; background: #e5483b; text-align: center; }
.folder { width: 52px; height: 40px; background: #EBA516; position: relative; box-shadow: inset 0 -6px 0 #c4860a; margin-top: 8px; }
.folder::before { content: ""; position: absolute; left: 0; top: -6px; width: 22px; height: 8px; background: #EBA516; }
.aivo-ic { width: 52px; height: 52px; background: #fff; border: 2px solid var(--line); display: grid; place-items: center; }
.aivo-ic img { max-width: 42px !important; image-rendering: auto !important; }
/* ── 창: 크림 종이, 먹 2점 테, 딱딱한 그림자 ── */
/* 창: 게임 대화창 (먹, 크림, 먹 두 겹 테 + 먹색 머리띠 + 강조색 줄) */
.wnd { position: fixed; background: var(--paper); box-shadow: 0 0 0 2px var(--line), 0 0 0 4px var(--paper), 0 0 0 6px var(--line), 8px 8px 0 6px rgba(12,16,36,.5); display: flex; flex-direction: column; min-width: 240px; }
.wnd[hidden] { display: none; }
.wnd.max { left: 6px !important; top: 6px !important; width: calc(100vw - 12px) !important; height: calc(100vh - var(--task) - 12px) !important; }
.wnd .tb { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 5px 0 0; background: var(--line); color: var(--paper); font-size: 12px; cursor: grab; flex: none; touch-action: none; }
.wnd .tb .flag { width: 30px; height: 30px; flex: none; display: grid; place-items: center; background: var(--acc, #02648C); }
.wnd .tb .flag svg, .wnd .tb button svg { width: 16px; height: 16px; display: block; }
.wnd .tb .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wnd .tb .stripes { flex: 1; min-width: 12px; height: 10px; background: repeating-linear-gradient(90deg, #3a3030 0 2px, transparent 2px 4px); }
.wnd .tb .bt { display: flex; gap: 2px; }
.wnd .tb button { width: 20px; height: 20px; padding: 0; display: grid; place-items: center; background: #3a3030; border: 0; cursor: pointer; }
.wnd .tb button:hover { background: #5a4a4a; }
.wnd .tb button[data-x] { background: #e5483b; } .wnd .tb button[data-x]:hover { background: #ff6a5a; }
.wnd .rule { height: 4px; flex: none; background: var(--acc, #02648C); }
.wnd.back .tb .flag, .wnd.back .rule { background: #8a7d6b; }
.wnd.back .tb .t { color: #a89a88; }
.wnd.back .tb button[data-x] { background: #5a4a4a; }
.wnd .body { overflow: auto; color: var(--line); font-family: "Noto Sans KR", sans-serif; font-size: 14px; line-height: 23px; -webkit-user-select: text; user-select: text; }
.wnd .st { display: flex; gap: 16px; padding: 5px 10px; font-size: 11px; line-height: 16px; color: #6b6052; background: #efe3cf; flex: none; overflow: hidden; white-space: nowrap; }
/* 프로젝트 창 */
.proj { display: grid; grid-template-columns: 1fr 220px; }
.proj .media { background: #000; display: grid; place-items: center; min-height: 0; }
.proj .media video, .proj .media img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
.proj .side { padding: 14px 16px; }
.proj .k { font-family: "Galmuri11", monospace; font-size: 11px; color: var(--acc); }
.proj h3 { font-size: 24px; line-height: 30px; font-weight: 900; }
.proj dl { display: grid; grid-template-columns: 34px 1fr; gap: 0 8px; margin: 8px 0 10px; font-size: 12px; line-height: 20px; }
.proj dt { color: var(--dim); font-family: "Galmuri11", monospace; } .proj dd { margin: 0; }
.proj dd b { font-weight: 400; font-family: "Galmuri11", monospace; font-size: 11px; background: #EBA516; padding: 0 5px; }
.proj p { font-size: 13px; line-height: 21px; color: #3a3030; word-break: keep-all; }
.open { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 7px 10px; background: var(--line); color: var(--paper); text-decoration: none; font-family: "Galmuri11", monospace; font-size: 12px; }
.open:hover, .open:focus-visible { background: var(--acc); outline: none; }
@media (max-width: 760px) { .proj { grid-template-columns: 1fr; } }
/* README */
.readme { padding: 16px 18px; font-family: "Galmuri11", monospace; font-size: 13px; line-height: 22px; }
.readme h2 { font-size: 20px; line-height: 28px; font-weight: 400; margin-bottom: 6px; }
.readme p + p { margin-top: 8px; }
.readme .dim { color: var(--dim); }
.readme .go { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.readme .go button { font-family: inherit; font-size: 12px; padding: 4px 10px; border: 2px solid var(--line); background: #fff; cursor: pointer; }
.readme .go button:hover { background: #EBA516; }
/* 프로젝트 문서 창: 프로젝트 페이지 글을 크림 종이에 다시 앉힌다 */
.doc { max-width: 980px; margin: 0 auto; padding: 8px 28px 48px; font-size: 15px; line-height: 27px; color: var(--line); }
.doc .phero { padding: 28px 0 24px; }
.doc .kind { font-family: "Galmuri11", monospace; font-size: 12px; color: var(--acc); }
.doc h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.1; font-weight: 900; letter-spacing: -.03em; margin: 8px 0 12px; }
.doc .line { font-size: 18px; line-height: 30px; max-width: 720px; word-break: keep-all; }
.doc .meta { margin-top: 12px; font-family: "Galmuri11", monospace; font-size: 12px; color: var(--dim); }
.doc .meta b { font-weight: 400; background: #EBA516; color: var(--line); padding: 0 6px; margin-left: 8px; }
.doc .cover { margin-top: 24px; box-shadow: 0 0 0 2px var(--line); }
.doc .cover img, .doc .cover video { width: 100%; aspect-ratio: 16/8; object-fit: cover; display: block; background: #000; }
.doc .about { display: grid; grid-template-columns: 1fr 2fr; gap: 32px; padding: 36px 0; border-bottom: 2px solid #d8ccb8; }
.doc .about h2 { font-family: "Galmuri11", monospace; font-size: 12px; font-weight: 400; color: var(--acc); }
.doc .about p { word-break: keep-all; } .doc .about p + p { margin-top: 10px; color: var(--dim); }
.doc .work { display: grid; grid-template-columns: 1.35fr 1fr; gap: 32px; align-items: center; padding: 40px 0; border-bottom: 2px solid #d8ccb8; }
.doc .work.rev { grid-template-columns: 1fr 1.35fr; } .doc .work.rev .vis { order: 2; }
.doc .work.full { grid-template-columns: 1fr; }
.doc .vis { display: grid; gap: 10px; } .doc .vis.two { grid-template-columns: 1fr 1fr; }
.doc .vis figure { margin: 0; }
.doc .vis .im { background: #1B1616; display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 2px var(--line); }
.doc .vis .im.light { background: #efe3cf; padding: 10px; }
.doc .vis .im img, .doc .vis .im video { max-width: 100%; max-height: 340px; width: auto; height: auto; display: block; }
.doc .vis figcaption { font-family: "Galmuri11", monospace; font-size: 12px; color: var(--dim); margin-top: 6px; }
.doc .txt .no { font-family: "Galmuri11", monospace; font-size: 12px; color: var(--acc); }
.doc .txt h3 { font-size: 24px; line-height: 32px; font-weight: 900; margin: 4px 0 10px; word-break: keep-all; }
.doc .txt p { color: #4a4040; word-break: keep-all; } .doc .txt p strong { color: var(--line); background: linear-gradient(transparent 60%, rgba(235,165,22,.45) 60%); }
.doc .shelf { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 0; background: #efe3cf; padding: 16px; box-shadow: 0 0 0 2px var(--line); }
.doc .shelf img { height: 140px; width: auto; margin: 0 auto; }
.doc .px { image-rendering: pixelated; }
.doc .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; font-family: "Galmuri11", monospace; font-size: 13px; }
.doc .nav button { font: inherit; padding: 8px 14px; background: var(--line); color: var(--paper); border: 0; cursor: pointer; }
.doc .nav button:hover { background: var(--acc); }
@media (max-width: 760px) { .doc { padding: 4px 14px 32px; } .doc .about, .doc .work, .doc .work.rev { grid-template-columns: 1fr; gap: 14px; } .doc .work.rev .vis { order: 0; } .doc .shelf img { height: 72px; } }
/* 작업 과정 폴더 */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 12px; }
.gallery button { display: grid; gap: 4px; padding: 6px; border: 2px solid transparent; background: none; cursor: pointer; text-align: left; font-family: "Galmuri11", monospace; font-size: 11px; color: var(--line); }
.gallery button:hover, .gallery button:focus-visible { border-color: var(--line); background: #fff; outline: none; }
.gallery .th { height: 92px; display: grid; place-items: center; background: #efe3cf; overflow: hidden; }
.gallery .th img { max-width: 100%; max-height: 92px; image-rendering: pixelated; }
.viewer { display: grid; place-items: center; background: #efe3cf; padding: 10px; }
.viewer img { max-width: 100%; max-height: 60vh; image-rendering: pixelated; }
.viewer p { font-family: "Galmuri11", monospace; font-size: 12px; margin-top: 8px; }
/* ── 한짝 위젯 ── */
.hj .body { overflow: hidden; }
.field { height: 172px; position: relative; background: linear-gradient(#fbe3c4, #f3c99a); overflow: hidden; }
.field::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #c98a52; border-top: 2px solid #8a5a32; }
.field .actor { position: absolute; bottom: 18px; z-index: 2; background-repeat: no-repeat; }
.field .me { left: 14px; width: 173px; height: 130px; background-image: url(img/hj/hero.webp); background-size: 2076px 130px; }
.field .mob { right: 18px; width: 133px; height: 100px; background-size: 2660px 100px; transition: opacity .3s steps(3); }
.field .mob.gone { opacity: 0; }
.field .me.ouch { animation: ouch .3s steps(2); }
@keyframes ouch { 50% { transform: translateX(-5px); filter: brightness(1.4) saturate(.6); } }
.field .hp { position: absolute; top: 8px; height: 10px; width: 130px; background: var(--line); border: 2px solid var(--line); z-index: 3; }
.field .hp i { display: block; height: 100%; background: #3fae7a; transition: width .2s steps(3); }
.field .dmg { position: absolute; z-index: 4; font-family: "Galmuri11", monospace; font-size: 16px; color: #e5483b; text-shadow: 2px 2px 0 #fff; animation: up .8s steps(5) forwards; pointer-events: none; }
.field .dmg.crit { font-size: 22px; color: #EBA516; text-shadow: 2px 2px 0 var(--line); }
@keyframes up { to { transform: translateY(-30px); opacity: 0; } }
/* ── 작업 표시줄 ── */
.task { position: fixed; left: 0; right: 0; bottom: 0; height: var(--task); background: var(--line); border-top: 2px solid #3a3030; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 12px; color: var(--paper); z-index: 9000; }
.task button { font-family: inherit; font-size: 12px; color: var(--paper); background: none; border: 0; cursor: pointer; }
.task .start { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; background: #EBA516; color: var(--line); }
.task .start[aria-expanded="true"] { background: var(--paper); }
.task .apps { display: flex; gap: 6px; overflow: hidden; }
.task .app { height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border: 2px solid #3a3030; white-space: nowrap; }
.task .app.on { border-color: var(--paper); background: #2a2222; }
.task .app i { width: 10px; height: 10px; display: inline-block; background: var(--acc); }
.task .tray { margin-left: auto; display: flex; gap: 14px; align-items: center; padding: 0 10px; color: var(--tan); }
.task .tray a { color: var(--tan); text-decoration: none; } .task .tray a:hover { color: var(--paper); }
.menu { position: fixed; left: 12px; bottom: calc(var(--task) + 12px); width: 260px; background: var(--paper); box-shadow: 0 0 0 2px var(--line), 0 0 0 4px var(--paper), 0 0 0 6px var(--line), 8px 8px 0 6px rgba(12,16,36,.5); z-index: 9001; display: none; color: var(--line); }
.menu.on { display: block; }
.menu .hd { background: var(--line); color: var(--paper); padding: 12px; font-size: 18px; line-height: 24px; border-bottom: 4px solid #EBA516; }
.menu .hd small { display: block; font-size: 11px; line-height: 16px; }
.menu a, .menu button { display: flex; justify-content: space-between; width: 100%; padding: 8px 12px; font-family: inherit; font-size: 13px; color: var(--line); text-decoration: none; background: none; border: 0; cursor: pointer; text-align: left; }
.menu a:hover, .menu button:hover, .menu a:focus-visible, .menu button:focus-visible { background: var(--line); color: var(--paper); outline: none; }
.menu kbd, .keys kbd { font-family: inherit; font-size: 10px; background: var(--tan); color: var(--line); padding: 0 5px; }
.menu hr { border: 0; border-top: 2px solid #d8ccb8; margin: 4px 0; }
.keys { padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-family: "Galmuri11", monospace; font-size: 12px; line-height: 20px; }
/* 휴대폰: 창은 화면을 채운다 */
@media (max-width: 760px) {
  .brand { left: 16px; bottom: 16px; } .brand b { font-size: 44px; }
  .icons { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); grid-template-rows: none; right: 16px; bottom: auto; }
  .ic { width: auto; }
  .wnd:not(.hj) { left: 6px !important; right: 6px; top: 6px !important; width: auto !important; max-height: calc(100vh - var(--task) - 12px); }
  .wnd.hj { left: auto !important; right: 6px; top: auto !important; bottom: calc(var(--task) + 6px); width: 260px !important; }
  .field { height: 140px; } .field .actor { transform: scale(.78); } .field .me { transform-origin: 0 100%; } .field .mob { transform-origin: 100% 100%; }
  .task .app span { display: none; } .task .tray .kb { display: none; }
}
</style>
</head>

  { href: 'mailto:seogu0307@gmail.com', label: '메일', pic: '<svg width="48" height="36" viewBox="0 0 16 12" shape-rendering="crispEdges"><path fill="#1b1616" d="M0 0h16v12H0z"/><path fill="#fdeeda" d="M1 1h14v10H1z"/><path fill="#e5483b" d="M1 1h1v1h1v1h1v1h1v1h1v1h4V5h1V4h1V3h1V2h1V1h1v1h-1v1h-1v1h-1v1h-1v1h-1v1H6V6H5V5H4V4H3V3H2V2H1z"/></svg>' },
];

// ── 아이콘 ──
const iconsEl = $('#icons'); let isel = 0;
const iconEls = ICONS.map((ic, i) => {
  const el = document.createElement(ic.href ? 'a' : 'button'); el.className = 'ic'; el.setAttribute('role', 'option');
  if (ic.href) el.href = ic.href; else el.type = 'button';
  el.innerHTML = `<span class="pic">${ic.pic}</span><span class="lb">${ic.label}</span>`;
  el.addEventListener('click', e => { if (ic.href) return; selIcon(i); if (e.detail >= 2 || matchMedia('(pointer: coarse)').matches) openWin(ic.id); });
  el.addEventListener('keydown', e => { if (!ic.href && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); openWin(ic.id); } });
  iconsEl.appendChild(el); return el;
});
const selIcon = (i, focus) => { isel = (i + ICONS.length) % ICONS.length; iconEls.forEach((el, j) => el.setAttribute('aria-selected', j === isel)); if (focus) iconEls[isel].focus(); };
selIcon(1);

// ── 창 ──
let z = 10; const wins = {}; const winsEl = $('#wins'), apps = $('#apps');
const DEF = {
  readme: { title: 'README.txt', acc: '#3a3030', w: 380, x: 140, y: 30, body: () => `<div class="readme"><h2>SEO GAEUN</h2>
      <p>게임 화면의 규칙을 세우고, 그 규칙대로 그림이 나오는 제작 흐름을 만들어요.</p>
      <p class="dim">아이콘을 두 번 누르거나, 숫자 1 2 3 으로 프로젝트를 열어 보세요.</p>
      <div class="go"><button data-open="dv">DEVIANT</button><button data-open="hjw">한짝</button><button data-open="av">AIVO</button></div></div>` },
  dv: { w: 660, x: 300, y: 90 }, hjw: { w: 660, x: 330, y: 120, p: 'hj' }, av: { w: 660, x: 360, y: 150 },
  work: { title: '작업 과정', acc: '#b8861a', w: 560, h: 420, x: 420, y: 60, body: () => `<div class="gallery">${WORK.map((w, i) => `<button data-view="${i}"><span class="th"><img src="${w[0]}" alt=""></span>${w[1]}<span style="color:#8a7d6b">${w[2]}</span></button>`).join('')}</div>`,
    st: [`항목 ${WORK.length}개`] },
  view: { title: '보기', acc: '#3a3030', w: 640, x: 380, y: 80 },
  keys: { title: '키 안내', acc: '#3a3030', w: 360, x: 460, y: 140, body: () => `<div class="keys">
      <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd></span><span>아이콘 고르기</span><span><kbd>ENTER</kbd></span><span>열기</span>
      <span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span><span>DEVIANT, 한짝, AIVO</span><span><kbd>4</kbd></span><span>작업 과정</span>
      <span><kbd>F</kbd></span><span>맨 앞 창의 프로젝트 페이지로</span><span><kbd>ESC</kbd></span><span>맨 앞 창 닫기</span>
      <span><kbd>TAB</kbd></span><span>창 바꾸기</span><span><kbd>M</kbd></span><span>시작 메뉴</span></div>` },
  widget: { title: '한짝 위젯', acc: '#d9621c', w: 340, x: -1, y: -1, cls: 'hj', body: () => `<div class="field" id="field">
      <div class="hp" style="left:8px"><i id="hp-me" style="width:100%"></i></div><div class="hp" style="right:8px"><i id="hp-mob" style="width:100%;background:#e5483b"></i></div><div class="actor me" id="me"></div><div class="actor mob" id="mob"></div></div>`, st: ['Lv.<span id="lv">12</span>', '처치 <span id="kills">0</span>'] },
};
const SVG = (d, c = '#fff') => `<svg viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="${c}" fill-rule="evenodd" d="${d}"/></svg>`;
const GLYPH = {
  dv: 'M2 0h4v1h1v4H6v1H5v2H3V6H2V5H1V1h1zM3 2v1h1V2zM5 2v1h1V2z',
  hj: 'M2 0h1v7H2zM5 0h1v7H5zM1 7h2v1H1zM5 7h2v1H5z',
  av: 'M3 0h2v1h1v3H5v1H3V4H2V1h1zM1 3h1v1h1v1h2V4h1V3h1v2H6v1H5v1h1v1H2V7h1V6H2V5H1z',
  doc: 'M1 0h4v1h1v1h1v6H1zM2 3v1h4V3zM2 5v1h4V5z',
  folder: 'M0 1h3v1h5v6H0z',
  key: 'M1 1h3v1h1v1h3v2H7v1H6V5H5v1H4v1H1V6H0V2h1zM2 3v2h1V3z',
  img: 'M0 1h8v6H0zM1 2v4h6V5H6V4H5v1H4V4H3v1H2V2z',
  min: 'M1 6h6v1H1z', max: 'M1 1h6v6H1zM2 3v3h4V3z',
  x: 'M1 1h1v1h1v1h2V2h1V1h1v1H6v1H5v2h1v1h1v1H6V6H5V5H3v1H2v1H1V6h1V5h1V3H2V2H1z',
};
const WGLYPH = { readme: 'doc', dv: 'dv', hjw: 'hj', av: 'av', work: 'folder', view: 'img', keys: 'key', widget: 'hj', 'doc-dv': 'dv', 'doc-hj': 'hj', 'doc-av': 'av' };
function projBody(k) {
  const p = PROJ[k];
  return `<div class="proj"><div class="media">${p.media}</div><div class="side"><div class="k">${p.kind}</div><h3>${p.name}</h3>
    <dl>${p.rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl><p>${p.p}</p>
    <a class="open" href="${p.href}" data-doc="${k}"><span>자세히 열기</span><span>F</span></a></div></div>`;
}
const DOCS = { dv: ['p-deviant.html', 'deviant'], hj: ['p-hanjjak.html', 'hanjjak'], av: ['p-aivo.html', 'aivo'] };
const ORDER = ['dv', 'hj', 'av'];
async function openDoc(k) {
  const id = 'doc-' + k, P = PROJ[k];
  if (wins[id]) { wins[id].hidden = false; front(id); return; }
  const el = openWin(id, { doc: true, title: P.name + ' / 자세히', acc: P.acc, body: '<div class="doc"><p style="padding:40px 0">불러오는 중</p></div>' });
  el.classList.add('max');
  history.replaceState(null, '', '#' + DOCS[k][1]);
  try {
    const html = await (await fetch(DOCS[k][0])).text();
    const dom = new DOMParser().parseFromString(html, 'text/html'), main = dom.querySelector('main');
    main.querySelector('nav.next')?.remove();
    const i = ORDER.indexOf(k), prev = ORDER[i - 1], next = ORDER[i + 1];
    el.querySelector('.body').innerHTML = `<article class="doc">${main.innerHTML}<div class="nav">${prev ? `<button data-docgo="${prev}">← ${PROJ[prev].name}</button>` : '<span></span>'}${next ? `<button data-docgo="${next}">${PROJ[next].name} →</button>` : '<button data-docclose>바탕화면으로</button>'}</div></article>`;
    el.querySelectorAll('video').forEach(v => { v.muted = true; v.play().catch(() => {}); });
  } catch (e) { location.href = DOCS[k][0]; }
}
function openWin(id, opt = {}) {
  menu(false);
  if (wins[id]) { wins[id].hidden = false; front(id); return wins[id]; }
  const d = DEF[id] || { w: 980, x: 40, y: 20, title: opt.title, acc: opt.acc }, pk = d.p || id, P = opt.doc ? null : PROJ[pk];
  const el = document.createElement('section'); el.className = 'wnd ' + (d.cls || ''); el.dataset.id = id;
  el.style.setProperty('--acc', P ? P.acc : d.acc);
  const W = Math.min(d.w, innerWidth - 24);
  el.style.width = W + 'px'; if (d.h) el.style.height = Math.min(d.h, innerHeight - 80) + 'px';
  el.style.left = (d.x < 0 ? innerWidth - W - 16 : Math.min(d.x, innerWidth - W - 12)) + 'px';
  el.style.top = (d.y < 0 ? innerHeight - 44 - 236 : d.y) + 'px';
  const st = P ? P.st : d.st;
  el.innerHTML = `<div class="tb"><span class="flag">${SVG(GLYPH[WGLYPH[id]])}</span><span class="t">${opt.title || (P ? P.title : d.title)}</span><span class="stripes"></span><span class="bt"><button data-min aria-label="내리기">${SVG(GLYPH.min, '#FDEEDA')}</button>${id === 'widget' ? '' : `<button data-max aria-label="크게">${SVG(GLYPH.max, '#FDEEDA')}</button>`}<button data-x aria-label="닫기">${SVG(GLYPH.x, '#FDEEDA')}</button></span></div><div class="rule"></div>
    <div class="body">${opt.body || (P ? projBody(pk) : d.body())}</div>${st ? `<div class="st">${st.map(s => `<span>${s}</span>`).join('')}</div>` : ''}`;
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', P ? P.name : d.title);
  winsEl.appendChild(el); wins[id] = el;
  el.addEventListener('pointerdown', () => front(id));
  el.querySelector('[data-x]').addEventListener('click', e => { e.stopPropagation(); closeWin(id); });
  el.querySelector('[data-max]')?.addEventListener('click', e => { e.stopPropagation(); el.classList.toggle('max'); });
  el.querySelector('[data-min]').addEventListener('click', e => { e.stopPropagation(); el.hidden = true; bar(); });
  drag(el);
  const b = document.createElement('button'); b.className = 'app'; b.dataset.id = id; b.style.setProperty('--acc', P ? P.acc : d.acc);
  b.innerHTML = `<i></i><span>${P ? P.name : d.title}</span>`;
  b.addEventListener('click', () => { if (!el.hidden && el.style.zIndex == z) { el.hidden = true; bar(); } else { el.hidden = false; front(id); } });
  apps.appendChild(b);
  front(id); return el;
}
function closeWin(id) { const el = wins[id]; if (!el) return; if (id.startsWith('doc-')) history.replaceState(null, '', location.pathname); el.remove(); delete wins[id]; apps.querySelector(`[data-id="${id}"]`)?.remove(); if (id === 'widget') battle(false); bar(); }
function front(id) { wins[id].style.zIndex = ++z; bar(); }
function topWin() { return Object.values(wins).filter(w => !w.hidden).sort((a, b) => b.style.zIndex - a.style.zIndex)[0]; }
function bar() { const t = topWin(); Object.values(wins).forEach(w => w.classList.toggle('back', w !== t)); apps.querySelectorAll('.app').forEach(b => b.classList.toggle('on', t && b.dataset.id === t.dataset.id)); }
function drag(el) {
  const tb = el.querySelector('.tb'); let sx, sy, ox, oy, on = false;
  tb.addEventListener('pointerdown', e => { if (e.target.closest('button') || innerWidth <= 760) return; on = true; sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; tb.setPointerCapture(e.pointerId); tb.style.cursor = 'grabbing'; });
  tb.addEventListener('pointermove', e => { if (!on) return;
    el.style.left = Math.max(-el.offsetWidth + 80, Math.min(innerWidth - 80, ox + e.clientX - sx)) + 'px';
    el.style.top = Math.max(0, Math.min(innerHeight - 80, oy + e.clientY - sy)) + 'px'; });
  ['pointerup', 'pointercancel'].forEach(t => tb.addEventListener(t, () => { on = false; tb.style.cursor = ''; }));
}
document.addEventListener('click', e => {
  const dk = e.target.closest('[data-doc]'); if (dk && !e.ctrlKey && !e.metaKey && !e.shiftKey) { e.preventDefault(); openDoc(dk.dataset.doc); return; }
  const dg = e.target.closest('[data-docgo]'); if (dg) { const t = topWin(); const go = dg.dataset.docgo; if (t) closeWin(t.dataset.id); openDoc(go); return; }
  if (e.target.closest('[data-docclose]')) { const t = topWin(); if (t) closeWin(t.dataset.id); return; }
  const o = e.target.closest('[data-open]'); if (o) { openWin(o.dataset.open); return; }
  const v = e.target.closest('[data-view]'); if (v) { const w = WORK[+v.dataset.view]; closeWin('view');
    openWin('view', { title: w[1], body: `<div class="viewer"><img src="${w[0]}" alt="${w[1]}"><p>${w[2]} / ${w[1]}</p></div>` }); }
});

// ── 시작 메뉴 ──
const menuEl = $('#menu'), start = $('#start');
function menu(on) { menuEl.classList.toggle('on', on); start.setAttribute('aria-expanded', on); if (on) menuEl.querySelector('button, a').focus(); }
start.addEventListener('click', e => { e.stopPropagation(); menu(!menuEl.classList.contains('on')); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menu, #start')) menu(false); });

// ── 시계 ──
const clock = () => { const d = new Date(); $('#clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
clock(); setInterval(clock, 10000);

// ── 한짝 위젯: 젓가락이 알아서 싸운다 ──
// 게임의 안 입은 젓가락(기본 나무검)과 같은 크기의 니기리 다섯
const MOBS = ['salmon-nigiri', 'shrimp-nigiri', 'tamago-nigiri', 'tuna-nigiri', 'flatfish-nigiri'];
const HW = 173, MW = 133;               // 화면에 그리는 한 칸 폭
let alive = false, mobHp = 100, meHp = 100, kills = 0, mi = 0, turn = 0, idleT = null;
const $id = id => document.getElementById(id);
const frame = (el, i, w) => { if (el) el.style.backgroundPosition = `${-i * w}px 0`; };
const wait = ms => new Promise(r => setTimeout(r, ms));
async function play(el, from, n, w, ms, onFrame) { for (let k = 0; k < n; k++) { frame(el, from + k, w); onFrame && onFrame(k); await wait(ms); } }
function idle() {                       // 둘 다 숨 쉬기
  clearInterval(idleT); let k = 0;
  idleT = setInterval(() => { if (!busyMe) frame($id('me'), k % 4, HW); if (!busyMob) frame($id('mob'), k % 4, MW); k++; }, 200);
}
let busyMe = false, busyMob = false;
function setMob() { const m = $id('mob'); if (!m) return; m.style.backgroundImage = `url(img/hj/${MOBS[mi]}.webp)`; frame(m, 0, MW); m.classList.remove('gone'); }
function pop(text, crit, x, y) {
  const f = $id('field'); if (!f) return; const n = document.createElement('span'); n.className = 'dmg' + (crit ? ' crit' : ''); n.textContent = text;
  n.style.left = x + 'px'; n.style.top = y + 'px'; f.appendChild(n); setTimeout(() => n.remove(), 800);
}
async function round() {
  if (!alive || !$id('field')) return;
  const me = $id('me'), mob = $id('mob'), f = $id('field');
  turn++;
  if (turn % 3 === 0) {                 // 몬스터 차례
    busyMob = true;
    await play(mob, 8, 4, MW, 120, k => { if (k === 2) { meHp = Math.max(20, meHp - 8 - Math.random() * 8); $id('hp-me').style.width = meHp + '%'; me.classList.remove('ouch'); void me.offsetWidth; me.classList.add('ouch'); pop('-' + Math.round(40 + Math.random() * 40), false, 60, 40); } });
    busyMob = false;
  } else {                              // 젓가락 차례: 내려치기와 찌르기를 번갈아
    busyMe = true; const from = turn % 2 ? 4 : 8;
    await play(me, from, 4, HW, 95, async k => {
      if (k !== 2) return;
      const crit = Math.random() < .2, d = Math.round((crit ? 2.2 : 1) * (9 + Math.random() * 9));
      mobHp -= d; $id('hp-mob').style.width = Math.max(0, mobHp) + '%';
      pop('-' + d * 8, crit, f.clientWidth - 130 + Math.random() * 30, 30 + Math.random() * 24);
      busyMob = true; play(mob, 12, 4, MW, 80).then(() => { busyMob = false; });
    });
    busyMe = false;
  }
  if (mobHp <= 0) {                      // 쓰러짐 → 다음 니기리
    busyMob = true; await wait(260); await play(mob, 16, 4, MW, 130); await wait(500);
    mob.classList.add('gone'); await wait(350);
    kills++; mi = (mi + 1) % MOBS.length; mobHp = 100; meHp = Math.min(100, meHp + 30);
    $id('kills').textContent = kills; if (kills % 3 === 0) $id('lv').textContent = 12 + kills / 3;
    $id('hp-mob').style.width = '100%'; $id('hp-me').style.width = meHp + '%';
    setMob(); busyMob = false; await wait(400);
  }
  setTimeout(round, 900 + Math.random() * 400);
}
function battle(on) {
  alive = on; clearInterval(idleT); if (!on) return;
  setMob(); idle(); setTimeout(round, 800);
}
// ── 키 ──
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const c = e.code;
  if (c === 'Slash' || e.key === '?') { e.preventDefault(); openWin('keys'); return; }
  if (c === 'KeyM') { menu(!menuEl.classList.contains('on')); return; }
  if (c === 'Escape') { if (menuEl.classList.contains('on')) { menu(false); return; } const t = topWin(); if (t) closeWin(t.dataset.id); return; }
  if (c === 'Tab') { const list = Object.values(wins).filter(w => !w.hidden); if (list.length > 1) { e.preventDefault(); const t = topWin(); const s = list.sort((a, b) => a.style.zIndex - b.style.zIndex)[0]; front(s.dataset.id); } return; }
  const num = ['Digit0', 'Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(c);
  if (num >= 0) { openWin(['readme', 'dv', 'hjw', 'av', 'work'][num]); return; }
  if (c === 'KeyF') { const t = topWin(); const a = t && t.querySelector('.open[data-doc]'); if (a) openDoc(a.dataset.doc); return; }
  if (menuEl.classList.contains('on')) return;
  const cols = Math.max(1, Math.round(iconsEl.clientHeight / 96));
  const mv = { ArrowDown: 1, ArrowUp: -1, ArrowRight: cols, ArrowLeft: -cols }[c];
  if (mv && !e.target.closest('.wnd .body')) { e.preventDefault(); selIcon(isel + mv, true); }
  if (c === 'Enter' && document.activeElement === document.body) { const ic = ICONS[isel]; ic.href ? location.href = ic.href : openWin(ic.id); }
});

// 처음 화면: README 와 한짝 위젯
// 프로젝트 페이지에서 돌아오면 ?open=N 으로 그 창을 연다
const back = ['', 'dv', 'hjw', 'av'][+new URLSearchParams(location.search).get('open')] || '';
if (innerWidth > 760 && !back) openWin('readme'); openWin('widget'); battle(true);
if (back) openWin(back);
const hashDoc = Object.keys(DOCS).find(k => '#' + DOCS[k][1] === location.hash);
if (hashDoc) openDoc(hashDoc);
})();
</script>
